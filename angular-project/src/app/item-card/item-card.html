<div
  class="card"
  appHoverHighlight
  [ngClass]="{ 'featured': item.id === 1 }"
>
  <div class="badge" *ngIf="item.id === 1">NEW</div>

  <img [src]="item.img" [alt]="item.title" />

  <h3>{{ item.title }}</h3>

  <p>{{ item.description | truncate:50 }}</p>

  <a
    [routerLink]="['/items', item.id]"
    class="details-link"
  >
    Детальніше
  </a>
</div>
